name: CI & Discovery Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Content Integrity & Repo Discovery Gate
        run: npm run check
      - name: Verify Build
        run: npm run build
